<!DOCTYPE html>
<html lang="en" data-theme="dark" data-sidebar-pos="left">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/number.css">
    <link rel="stylesheet" href="./style/spinner.css">
    <link rel="stylesheet" href="style/coin.css">
</head>
<body>

    <div id="rans-app">
        <!-- 🛠️ SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="sidebar">
            
            <!-- Block 1: Header -->
            <div class="sidebar-header">
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="12" height="12" x="6" y="6" rx="2"/><path d="m16 8-8 8"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/></svg>
                    <span class="brand-name">RANS</span>
                </div>
                <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle Sidebar (Ctrl+B)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9-3 3 3 3"/></svg>
                </button>
            </div>

            <!-- Block 2: 12 Modules Nav -->
            <nav class="sidebar-nav custom-scroll">
                <a href="#number" class="nav-item active" data-module="number">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M10 8h4v8"/><path d="M8 16h8"/></svg>
                    <span class="nav-label">Number Generator</span>
                </a>
                <a href="#spinner" class="nav-item" data-module="spinner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span class="nav-label">Custom Spinner</span>
                </a>
                <a href="#coin" class="nav-item" data-module="coin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/></svg>
                    <span class="nav-label">Flip a Coin</span>
                </a>
                <a href="#dice" class="nav-item" data-module="dice">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="16" x="4" y="4" rx="2"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="15" r="1.5"/></svg>
                    <span class="nav-label">Roll a Dice</span>
                </a>
                <a href="#groups" class="nav-item" data-module="groups">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span class="nav-label">Group Generator</span>
                </a>
                <a href="#color" class="nav-item" data-module="color">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.5-.72 1.5-1.5 0-.4-.15-.78-.42-1.07-.27-.29-.42-.68-.42-1.07 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.97-4.48-9-10-9z"/></svg>
                    <span class="nav-label">Color Palette</span>
                </a>
                <a href="#quotes" class="nav-item" data-module="quotes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-3 2s-1 1-1 2c0 1 0 2 2 2z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-3 2s-1 1-1 2c0 1 0 2 2 2z"/></svg>
                    <span class="nav-label">Random Quotes</span>
                </a>
                <a href="#food" class="nav-item" data-module="food">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2v20"/><path d="M18 2a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4"/><path d="M2 2v8a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V2"/><path d="M8 2v12"/><path d="M8 14v8"/></svg>
                    <span class="nav-label">Food Picker</span>
                </a>
                <a href="#cards" class="nav-item" data-module="cards">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="18" x="5" y="3" rx="2"/><path d="m12 8 2 3-2 3-2-3z"/></svg>
                    <span class="nav-label">Card Drawer</span>
                </a>
                <a href="#image" class="nav-item" data-module="image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                    <span class="nav-label">Image Placeholder</span>
                </a>
                <a href="#password" class="nav-item" data-module="password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15.5 7.5 3 3L22 7l-3-3"/><path d="M10.85 12.15a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78l1.43-1.43 2.5 2.5 2.5-2.5-1.43-1.43a5.5 5.5 0 0 1-4.92-2.84"/></svg>
                    <span class="nav-label">Password Generator</span>
                </a>
                <a href="#time" class="nav-item" data-module="time">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="nav-label">Time Info</span>
                </a>
            </nav>

            <!-- Block 3: Settings & Status -->
            <div class="sidebar-footer">
                <div class="entropy-status" title="Live Entropy Pool Status">
                    <span class="dot pulse"></span>
                    <span class="status-text">Entropy Live</span>
                </div>

                <div class="footer-actions">
                    <button id="btn-theme-toggle" class="btn-icon" title="Toggle Theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
                    </button>
                    <button id="btn-sidebar-pos" class="btn-icon" title="Switch Sidebar Position">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 3 4 8 5-5 4 15H3L8 3z"/></svg>
                    </button>
                    <button id="btn-history-toggle" class="btn-icon" title="Open History">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                    </button>
                </div>
            </div>

        </aside>

        <!-- 🎯 DYNAMIC WORKSPACE -->
        <main id="main-workspace" class="workspace">
            <div id="module-container" class="module-container"></div>
        </main>

        <!-- 📜 SLIDE-OVER HISTORY DRAWER -->
        <div id="history-drawer" class="history-drawer">
            <div class="drawer-header">
                <div class="drawer-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                    <span>Global History Log</span>
                </div>
                <button id="btn-close-history" class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div id="history-content" class="drawer-body custom-scroll"></div>
            <div class="drawer-footer">
                <button id="btn-clear-history" class="btn-danger-outline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    <span>Clear All History</span>
                </button>
            </div>
        </div>

        <div id="drawer-backdrop" class="drawer-backdrop"></div>
    </div>

    <script type="module" src="./bootstrap/app.js"></script>
</body>
</html>
