<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Entropy Generator - Beta Debug</title>
</head>
<body>
    <h1>Entropy Engine Beta</h1>
    <p>Nhấn F12 để theo dõi quá trình tạo số ngẫu nhiên...</p>
    <button id="generateBtn">Tạo số ngẫu nhiên mới</button>

    <script type="module">
    import { getTrulyRandomNumber } from './JS/mixer.js';

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const randomVal = await getTrulyRandomNumber(1, 100);
        // Chỉ xuất kết quả cuối cùng hoặc cập nhật vào giao diện
        document.getElementById('result').innerText = "Số ngẫu nhiên: " + randomVal;
    });
</script>
<div id="result"></div>
</body>
</html>
